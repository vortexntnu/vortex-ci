services:
  ros2:
    image: test:latest
    container_name: vortex_dev
    stdin_open: true
    tty: true

    gpus: all

    environment:
      DISPLAY: ${DISPLAY:?Set DISPLAY from your desktop session}
      XAUTHORITY: /tmp/host.xauth
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility,compute
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia

    volumes:
      - .:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - type: bind
        source: ${XAUTHORITY:?Set XAUTHORITY to your desktop Xauthority file}
        target: /tmp/host.xauth
        read_only: true
        bind:
          create_host_path: false

    working_dir: /ros2_ws
    command: bash